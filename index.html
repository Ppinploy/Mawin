<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Be My Valentine Baby?</title>

    <link rel="stylesheet" href="css/style.css">
   <link rel="icon" href="css/js/images/heart.gif" type="image/gif">
</head>

<body>

    <div class="hearts"></div>

    <div class="container">

        <!-- Step 1 -->
        <div class="step active" id="step1">

           <img src="css/js/images/AshSnow.gif"
                alt="Cute Cat"
                class="cat-img">

            <h1>Will you be my Valentine? 💝</h1>

            <div class="buttons">

                <button class="btn btn-yes" onclick="goToStep2()">
                    Yes
                </button>

                <button class="btn btn-no"
                        onmouseover="moveButton(this)"
                        onclick="moveButton(this)">
                    No
                </button>

            </div>
        </div>


        <!-- Step 2 -->
        <div class="step" id="step2">

            <img src="css/js/images/are-u-sure.gif"
                 alt="Cute Cat in Love"
                 class="cat-img">

            <h1>
                Are you sure you want to be my valentine? 😼
            </h1>

            <div class="buttons">

                <button class="btn btn-yes" onclick="goToStep3()">
                    Yes, 100% Sure
                </button>

                <button class="btn btn-no"
                        onmouseover="moveButton(this)"
                        onclick="moveButton(this)">
                    Let me think...
                </button>

            </div>
        </div>


        <!-- Step 3 -->
        <div class="step" id="step3">

            <img src="css/js/images/Hugging.gif"
                 alt="Cute Cat in Love"
                 class="cat-img">

            <h1>
                Promise me you'll always be my valentine ❤️
            </h1>

            <div class="buttons">

                <button class="btn btn-yes" onclick="finalStep()">
                    Yes, I Promise
                </button>

            </div>
        </div>


        <!-- Final Message -->
        <div class="final-message" id="finalMessage">

            <img src="css/js/images/kisses.gif"
                 alt="Cute Cat in Love"
                 class="cat-img">

            <p>
                Yaaaahoooooo, You made Valentine so special for me,
                I Love You! 🥰
            </p>

            <p style="margin-top: 15px;">
                You can text me by clicking the button below.
                I'm waiting for you, Baby ko!
            </p>

            <a href="https://www.facebook.com/share/1BfyNHAs2o/?mibextid=wwXIfr"
               class="facebook-btn"
               target="_blank"
               rel="noopener noreferrer">
                Text me here 💌
            </a>

        </div>

    </div>

   <script src="css/js/script.js"></script>

</body>
</html>
